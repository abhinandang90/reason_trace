[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasontrace"
version = "0.1.0"
description = "Local-first reasoning drift detection for AI agents, served as an MCP server"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "agents", "mcp", "observability", "llm", "reasoning", "drift"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=0.4.0",
    "sentence-transformers>=2.7.0",
    "numpy>=1.26.0",
]

[project.scripts]
reasontrace-server = "reasontrace.server:run"
reasontrace-install = "reasontrace.installer:install"

[tool.setuptools.packages.find]
where = ["."]
include = ["reasontrace*"]
